name: Build and Deploy Unity Game to Itch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [unity-build-trigger]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: |
            **/Library
            **/Temp
            **/Obj
            **/Logs
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-

      - name: Set up Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: ${{ vars.UNITY_VERSION }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build/StandaloneWindows64

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: |
            **/Library
            **/Temp
            **/Obj
            **/Logs
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-

      - name: Set up Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneOSX
          unityVersion: ${{ vars.UNITY_VERSION }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Rename Build
        run: |
          mkdir -p "build/$GAME_NAME"
          mv "build/StandaloneOSX/StandaloneOSX.app" "build/$GAME_NAME/$GAME_NAME.app"
        env:
          GAME_NAME: ${{ vars.ITCH_IO_GAME_NAME }}

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Build
          path: "build/${{ env.GAME_NAME }}"
        env:
          GAME_NAME: ${{ vars.ITCH_IO_GAME_NAME }}

  build-webgl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: |
            **/Library
            **/Temp
            **/Obj
            **/Logs
          key: ${{ runner.os }}-unity-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-

      - name: Set up Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          unityVersion: ${{ vars.UNITY_VERSION }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL/*

  deploy-itch:
    needs: [build-windows, build-macos, build-webgl]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Windows-Build
          path: build/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: MacOS-Build
          path: build/macos

      - name: Download WebGL Build
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: build/webgl

      - name: Install itch.io butler
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Запасная версия на случай, если API недоступен или ответ пустой.
          BUTLER_FALLBACK: v15.29.0
        run: |
          set -euo pipefail

          # Намеренно НЕ используем /releases/latest/download/: релиз butler может
          # выйти вообще без бинарников (так случилось с v15.30.0 от 27.07.2026),
          # и тогда эта ссылка отдаёт 404 с девятибайтовым телом "Not Found",
          # curl молча кладёт его в butler.zip, а падает уже unzip — с сообщением,
          # по которому причину не угадать. Ищем свежайший релиз, у которого
          # нужный ассет реально есть.
          # "|| url=" обязателен: под set -e и pipefail упавший curl или jq
          # уронил бы весь шаг прямо здесь, и до запасного варианта дело бы не дошло.
          url=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN:-}" \
                  "https://api.github.com/repos/itchio/butler/releases?per_page=20" \
                | jq -r '[.[] | select(.draft == false and .prerelease == false)
                             | .assets[]?
                             | select(.name == "butler-linux-amd64.zip")
                             | .browser_download_url][0] // empty') || url=""

          if [ -z "$url" ]; then
            echo "Релиз с butler-linux-amd64.zip через API не нашёлся, беру запасной $BUTLER_FALLBACK"
            url="https://github.com/itchio/butler/releases/download/$BUTLER_FALLBACK/butler-linux-amd64.zip"
          fi

          echo "Качаю butler: $url"
          # --fail: любой не-200 роняет шаг здесь, а не через unzip.
          curl -sSL --fail -o butler.zip "$url"
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          sudo mv linux-amd64/butler /usr/local/bin/
          butler -V || true

      - name: Authenticate butler
        run: |
          butler login
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}

      - name: Deploy to itch.io
        run: |
          butler push build/windows $ITCH_IO_USERNAME/$ITCH_IO_GAME_NAME:windows
          butler push build/macos $ITCH_IO_USERNAME/$ITCH_IO_GAME_NAME:macos
          butler push build/webgl $ITCH_IO_USERNAME/$ITCH_IO_GAME_NAME:html
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}
          ITCH_IO_USERNAME: ${{ vars.ITCH_IO_USERNAME }}
          ITCH_IO_GAME_NAME: ${{ vars.ITCH_IO_GAME_NAME }}
